
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrintHub</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo">
    <h1 class="logo">Print<span>Hub</span></h1>
    <div class="topo-direita">
      <a href="conta.html" id="ola"
         style="color: var(--texto-suave); font-size: 0.9rem; text-decoration: none;"></a>
      <a class="botao botao-secundario btn-pequeno" href="reservas.html">Reservas</a>
      <a class="botao botao-secundario btn-pequeno" id="link-admin"
         href="admin.html" style="display:none;">Administração</a>
      <a class="botao btn-pequeno" href="nova-postagem.html">+ Nova postagem</a>
      <button class="botao-secundario btn-pequeno" id="sair">Sair</button>
    </div>
  </header>

  <main class="conteudo">
    <div class="barra">
      <input type="search" id="busca" placeholder="Buscar por título ou tag...">
      <button class="botao-secundario btn-pequeno" id="btn-favoritas">★ Só favoritas</button>
    </div>

    <div class="grade" id="grade"></div>
  </main>

  <script src="js/api.js"></script>
  <script>
    const grade = document.getElementById('grade');
    const campoBusca = document.getElementById('busca');
    const btnFavoritas = document.getElementById('btn-favoritas');

    let soFavoritas = false;
    let temporizador;

    function escapar(texto) {
      const div = document.createElement('div');
      div.textContent = texto ?? '';
      return div.innerHTML;
    }

    function cartao(p) {
      const tags = (p.tags || '')
        .split(',')
        .map(t => t.trim())
        .filter(t => t !== '')
        .map(t => `<span class="tag">${escapar(t)}</span>`)
        .join('');

      const arquivos = [p.arquivo1, p.arquivo2, p.arquivo3]
        .filter(a => a)
        .map((a, i) => `<a href="${escapar(a)}" download>📎 Arquivo ${i + 1}</a>`)
        .join('');

      const data = new Date(
        p.data_publicacao.replace(' ', 'T')
      ).toLocaleDateString('pt-BR');

      const botaoEditar = p.minha
        ? `<a class="botao botao-secundario btn-pequeno"
              href="editar-postagem.html?id=${Number(p.id_postagem)}">Editar</a>`
        : '';

      const botaoApagar = p.minha
        ? `<button class="apagar" data-id="${p.id_postagem}">Apagar</button>`
        : '';

      return `
        <article class="post">
          <img src="${escapar(p.imagem)}" alt=""
               onerror="this.style.display='none'">

          <div class="post-corpo">
            <h3>${escapar(p.titulo)}</h3>
            <span class="post-autor">
              por ${escapar(p.autor)} · ${data}
            </span>

            <p class="post-texto">${escapar(p.texto)}</p>

            <div class="tags">${tags}</div>
            <div class="arquivos">${arquivos}</div>

            <div class="post-rodape">
              <button class="fav ${p.favoritado ? 'ativo' : ''}"
                      data-id="${p.id_postagem}">
                ${p.favoritado ? '★' : '☆'} ${p.total_favoritos}
              </button>

              ${botaoEditar}
              ${botaoApagar}
            </div>
          </div>
        </article>`;
    }

    async function carregar() {
      const params = new URLSearchParams();

      if (campoBusca.value.trim() !== '') {
        params.set('busca', campoBusca.value.trim());
      }

      if (soFavoritas) {
        params.set('favoritas', '1');
      }

      try {
        const lista = await chamarApi(
          'postagens.php?' + params.toString()
        );

        grade.innerHTML = lista.length
          ? lista.map(cartao).join('')
          : '<p class="vazio">Nenhuma postagem encontrada.</p>';

      } catch (erro) {
        grade.innerHTML =
          '<p class="vazio">' + escapar(erro.message) + '</p>';
      }
    }

    campoBusca.addEventListener('input', () => {
      clearTimeout(temporizador);
      temporizador = setTimeout(carregar, 300);
    });

    btnFavoritas.addEventListener('click', () => {
      soFavoritas = !soFavoritas;

      btnFavoritas.textContent = soFavoritas
        ? '★ Mostrando favoritas'
        : '★ Só favoritas';

      carregar();
    });

    grade.addEventListener('click', async (e) => {
      const apagar = e.target.closest('.apagar');

      if (apagar) {
        if (!confirm('Apagar esta postagem?')) return;

        try {
          await chamarApi(
            'postagens.php?id=' + apagar.dataset.id,
            { method: 'DELETE' }
          );
          carregar();
        } catch (erro) {
          alert(erro.message);
        }
        return;
      }

      const botao = e.target.closest('.fav');
      if (!botao) return;

      try {
        const r = await enviarJson('favoritar.php', {
          id_postagem: Number(botao.dataset.id)
        });

        if (soFavoritas && !r.favoritado) {
          carregar();
          return;
        }

        botao.classList.toggle('ativo', r.favoritado);
        botao.textContent =
          (r.favoritado ? '★ ' : '☆ ') + r.total_favoritos;

      } catch (erro) {
        alert(erro.message);
      }
    });

    document.getElementById('sair').addEventListener('click', async () => {
      await chamarApi('logout.php');
      location.href = 'login.html';
    });

    usuarioLogado().then(u => {
      if (!u) {
        location.href = 'login.html';
        return;
      }

      document.getElementById('ola').textContent =
        'Olá, ' + u.nome_usuario;

      if (u.admin) {
        document.getElementById('link-admin').style.display = '';
      }

      carregar();
    });
  </script>
</body>
</html>
